<!DOCTYPE html>
<html>
<head>
  <title>Crime Map Filter (Leaflet)</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }
    #controls {
      padding: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      background: #f8f9fa;
      border-bottom: 1px solid #ccc;
    }
    #map {
      width: 100%;
      height: 90vh;
    }
    select, input[type="date"], button {
      padding: 5px;
      border-radius: 6px;
      border: 1px solid #aaa;
    }
  </style>
</head>
<body>

  <div id="controls">
    <label>From: <input type="date" id="startDate"></label>
    <label>To: <input type="date" id="endDate"></label>
    <label>Type:
      <select id="crimeType">
        <option value="">All</option>
      </select>
    </label>
    <button id="filterBtn">Filter</button>
  </div>

  <div id="map"></div>

  <script>
    let map = L.map('map').setView([39.5, -98.35], 4); // center of US

    // Add base tiles (free OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let allData = [];
    let markersLayer = L.layerGroup().addTo(map);

    async function fetchData() {
      const response = await fetch('https://script.google.com/macros/s/AKfycbyu7pbLizSL2QH-ZIp_sFGAlRwvvZupQN_x6OLh2a_ra5nseqP-0ww-D3KbJCzYCi_7_Q/exec');
      allData = await response.json();

      // Build dropdown of unique crime types
      const types = [...new Set(allData.map(d => d.crime).filter(Boolean))];
      const select = document.getElementById('crimeType');
      types.forEach(type => {
        const opt = document.createElement('option');
        opt.value = type;
        opt.textContent = type;
        select.appendChild(opt);
      });

      renderMarkers(allData);
    }

    function renderMarkers(data) {
      markersLayer.clearLayers();
      data.forEach(item => {
        if (!item.lat || !item.lng) return; // skip if no coordinates

        const icon = L.icon({
          iconUrl: 'https://cdn-icons-png.flaticon.com/512/616/616408.png', // customize
          iconSize: [24, 24],
        });

        const marker = L.marker([item.lat, item.lng], { icon }).bindPopup(`
          <b>${item.crime || 'Unknown Crime'}</b><br>
          ${item.date || ''}<br>
          ${item.address || ''}<br>
          ${item.city || ''} ${item.zip || ''}
        `);
        markersLayer.addLayer(marker);
      });
    }

    function applyFilters() {
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;
      const type = document.getElementById('crimeType').value;

      const filtered = allData.filter(item => {
        const date = item.date ? new Date(item.date) : null;
        const afterStart = !start || (date && date >= new Date(start));
        const beforeEnd = !end || (date && date <= new Date(end));
        const matchesType = !type || item.crime === type;
        return afterStart && beforeEnd && matchesType;
      });

      renderMarkers(filtered);
    }

    document.getElementById('filterBtn').addEventListener('click', applyFilters);

    fetchData();
  </script>
</body>
</html>

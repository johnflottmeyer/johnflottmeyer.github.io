<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Crime Map with Legend & Charts</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    body { margin:0; font-family: Arial, sans-serif; }
    #controls {
      padding:10px;
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
      background:#f6f7f8;
      border-bottom:1px solid #ccc;
      z-index: 1001;
      position: relative;
    }
    #controls label { font-size: 14px; }
    #controls select,input[type="date"],button {
      padding:5px 8px;
      border-radius:4px;
      border:1px solid #ccc;
      font-size:14px;
    }
    #map { height: calc(100vh - 100px); width:100%; position:relative; }
    .info { font-size:13px; color:#555; }
    .fa-icon { font-size: 20px; }
    .legend {
      background:white;
      padding:8px;
      border-radius:6px;
      box-shadow:0 0 15px rgba(0,0,0,0.2);
      font-size:14px;
    }
    .legend i { margin-right:6px; }
    #disclaimer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(255,255,255,0.95);
      padding: 8px 12px;
      font-size: 13px;
      text-align: center;
      border-top: 1px solid #ccc;
      color: #333;
      z-index: 1000;
    }

    /* Chart drawer styles on right */
    #chartDrawer {
      position: fixed;
      top: 60px;
      right: 0;
      bottom: 60px;
      width: 350px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: -2px 0 8px rgba(0,0,0,0.3);
      padding: 10px;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 1200;
    }
    #chartDrawer.open {
      transform: translateX(0);
    }
    #chartToggle {
      position: fixed;
      top: 80px;
      right: 0;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px 0 0 4px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: -2px 2px 5px rgba(0,0,0,0.3);
      cursor: pointer;
      z-index: 1300;
    }
    #chartDrawer canvas {
      max-width: 100%;
      margin: 15px 0;
    }
    #chartDrawer h4 {
      margin: 10px 0 5px;
      font-size: 15px;
    }
  </style>
</head>
<body>

<div id="controls">
  <label>From: <input type="date" id="startDate"></label>
  <label>To: <input type="date" id="endDate"></label>

  <label>Type:
    <select id="crimeType"><option value="">All</option></select>
  </label>

  <button id="filterBtn">Apply</button>
  <button id="resetBtn">Reset</button>

  <label>Map Style:
    <select id="mapStyle">
      <option value="street">Street</option>
      <option value="dark">Dark</option>
      <option value="satellite">Satellite</option>
    </select>
  </label>

  <span class="info" id="status">Loading…</span>
</div>

<div id="map"></div>

<div id="chartToggle" title="Toggle Charts">
  <i class="fa fa-chart-bar"></i>
</div>

<div id="chartDrawer">
  <h4>Most Common Incident Types</h4>
  <canvas id="crimeTypeChart"></canvas>

  <h4>Incidents by Hour</h4>
  <canvas id="crimeHourChart"></canvas>

  <h4>Incidents by Day</h4>
  <canvas id="crimeDayChart"></canvas>
</div>

<div id="disclaimer">
  ⚠ <strong>Disclaimer:</strong> These are reported incidents. They do not necessarily represent confirmed crimes or convictions. Data is provided for informational purposes only.
</div>

<script>
(async function(){
  const DATA_URL = "https://script.google.com/macros/s/AKfycbyu7pbLizSL2QH-ZIp_sFGAlRwvvZupQN_x6OLh2a_ra5nseqP-0ww-D3KbJCzYCi_7_Q/exec";
  const CENTER = [44.0221, -92.4630];
  const ZOOM = 11;

  const streetTiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OpenStreetMap' });
  const darkTiles = L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_dark/{z}/{x}/{y}{r}.png', { attribution:'© Stadia Maps' });
  const satelliteTiles = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { attribution:'© OpenTopoMap' });

  const map = L.map('map', { layers: [streetTiles] }).setView(CENTER, ZOOM);

  let markersLayer = L.layerGroup().addTo(map);
  let rawData = [];
  let normData = [];
  let charts = {};

  function pick(o, keys){
    for(const k of keys){
      if (o && o[k] !== undefined && o[k] !== null && String(o[k]).trim() !== "") return o[k];
    }
    return "";
  }

  function normalize(rec){
    const raw = rec || {};
    const dateStr = pick(raw, ['createDateTime','CreateDateTime','DateTimeIncident','date','datetime']);
    let date = dateStr ? new Date(dateStr) : null;
    const lat = parseFloat(pick(raw, ['lat','Lat','latitude','Latitude']));
    const lng = parseFloat(pick(raw, ['long','lng','lon','Longitude']));
    return {
      raw,
      date,
      dateRaw: dateStr || "",
      lat: (!isNaN(lat) ? lat : null),
      lng: (!isNaN(lng) ? lng : null),
      type: pick(raw, ['incidentType','IncidentType','crime','Crime','type','Type','Incident']),
      address: pick(raw, ['FullAddress','address','Address','location','Location']),
      city: pick(raw, ['city','City','venue','Venue']),
      zip: pick(raw, ['zip','Zip','postal','Postal'])
    };
  }

  async function loadData(){
    document.getElementById('status').textContent = 'Loading data…';
    try {
      const res = await fetch(DATA_URL);
      if(!res.ok) throw new Error('Fetch failed: ' + res.status);
      let data = await res.json();
      rawData = Array.isArray(data) ? data : (data.records || []);
      if (!Array.isArray(rawData)) throw new Error('Unexpected data format');

      normData = rawData.map(normalize);
      populateTypes();
      renderMarkers(normData);
      addLegend(map);
      updateCharts(normData);
      document.getElementById('status').textContent = `Loaded ${normData.length} records`;
    } catch (err) {
      console.error('Error loading data:', err);
      document.getElementById('status').textContent = 'Error loading feed';
    }
  }

  function populateTypes(){
    const types = Array.from(new Set(normData.map(d=>d.type).filter(Boolean))).sort();
    const select = document.getElementById('crimeType');
    select.querySelectorAll('option:not([value=""])').forEach(n=>n.remove());
    types.forEach(t => { const opt = document.createElement('option'); opt.value = t; opt.textContent = t; select.appendChild(opt); });
  }

  function popupHtml(d){
    return `<div style="font-size:13px;">
      <strong>${d.type || 'Incident'}</strong><br/>
      ${d.address || ''}<br/>
      ${d.city || ''} ${d.zip || ''}<br/>
      <small>${d.dateRaw || ''}</small>
    </div>`;
  }

  function iconForType(type){
    const t = (type||'').toLowerCase();
    let iconClass = "fa-map-marker-alt";
    let color = "red";
    if(t.includes("traffic")) { iconClass = "fa-car"; color = "blue"; }
    if(t.includes("burglary")) { iconClass = "fa-user-secret"; color = "orange"; }
    if(t.includes("theft")) { iconClass = "fa-hand-paper"; color = "purple"; }
    if(t.includes("drugs")) { iconClass = "fa-prescription-bottle-medical"; color = "green"; }
    if(t.includes("assist")) { iconClass = "fa-hands-helping"; color = "cadetblue"; }
    if(t.includes("crisis")) { iconClass = "fa-triangle-exclamation"; color = "yellow"; }

    return L.divIcon({
      html: `<i class="fa ${iconClass} fa-icon" style="color:${color}"></i>`,
      className: "",
      iconSize: [24, 24],
      iconAnchor: [12, 24]
    });
  }

  function renderMarkers(data){
    markersLayer.clearLayers();
    let count = 0;
    const bounds = L.latLngBounds();
    data.forEach(d=>{
      if(d.lat == null || d.lng == null) return;
      const marker = L.marker([d.lat,d.lng], {icon:iconForType(d.type)})
        .bindPopup(popupHtml(d));
      markersLayer.addLayer(marker);
      bounds.extend([d.lat, d.lng]);
      count++;
    });
    if (count > 0) map.fitBounds(bounds);
    document.getElementById('status').textContent = `Showing ${count} of ${normData.length} records`;
  }

  function applyFilters(){
    const startVal = document.getElementById('startDate').value;
    const endVal = document.getElementById('endDate').value;
    const typeVal = document.getElementById('crimeType').value;
    const start = startVal ? new Date(startVal+'T00:00:00') : null;
    const end = endVal ? new Date(endVal+'T23:59:59') : null;

    const filtered = normData.filter(d=>{
      if(d.lat == null || d.lng == null) return false;
      if(start && (!d.date || d.date<start)) return false;
      if(end && (!d.date || d.date>end)) return false;
      if(typeVal && (!d.type || d.type.toLowerCase()!==typeVal.toLowerCase())) return false;
      return true;
    });
    renderMarkers(filtered);
    updateCharts(filtered);
  }

  function addLegend(map) {
    const legend = L.control({position: 'bottomright'});
    legend.onAdd = function () {
        const div = L.DomUtil.create('div', 'legend');
        div.innerHTML += "<strong>Crime Types</strong><br/>";
        const types = [
            {label: "Traffic", icon: "fa-car", color: "blue"},
            {label: "Burglary", icon: "fa-user-secret", color: "orange"},
            {label: "Theft", icon: "fa-hand-paper", color: "purple"},
            {label: "Drugs", icon: "fa-prescription-bottle-medical", color: "green"},
            {label: "Assist", icon: "fa-hands-helping", color: "cadetblue"},
            {label: "Crisis", icon: "fa-triangle-exclamation", color: "yellow"},
            {label: "Other", icon: "fa-map-marker-alt", color: "red"}
        ];
        types.forEach(type => {
            div.innerHTML += `<i class="fa ${type.icon}" style="color:${type.color}"></i> ${type.label}<br/>`;
        });
        return div;
    };
    legend.addTo(map);
  }

  function updateCharts(data){
    const typeCount = {};
    const hourCount = new Array(24).fill(0);
    const dayCount = new Array(7).fill(0);
    const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

    data.forEach(c => {
      const type = c.type || "Unknown";
      typeCount[type] = (typeCount[type] || 0) + 1;
      const d = new Date(c.date);
      if (!isNaN(d)) {
        hourCount[d.getHours()]++;
        dayCount[d.getDay()]++;
      }
    });

    const topTypes = Object.entries(typeCount)
      .sort((a,b) => b[1]-a[1])
      .slice(0,10);

    const ctxType = document.getElementById("crimeTypeChart");
    const ctxHour = document.getElementById("crimeHourChart");
    const ctxDay = document.getElementById("crimeDayChart");

    if (charts.type) charts.type.destroy();
    if (charts.hour) charts.hour.destroy();
    if (charts.day) charts.day.destroy();

    charts.type = new Chart(ctxType, {
      type: "bar",
      data: {
        labels: topTypes.map(t => t[0]),
        datasets: [{
          label: "Incidents",
          data: topTypes.map(t => t[1]),
          backgroundColor: "#dc3545"
        }]
      },
      options: { plugins:{legend:{display:false}}, scales:{x:{ticks:{autoSkip:false}}}}
    });

    charts.hour = new Chart(ctxHour, {
      type: "line",
      data: {
        labels: [...Array(24).keys()],
        datasets: [{
          label: "Incidents by Hour",
          data: hourCount,
          borderColor: "#007bff",
          tension: 0.3
        }]
      },
      options: { plugins:{legend:{display:false}}}
    });

    charts.day = new Chart(ctxDay, {
      type: "bar",
      data: {
        labels: days,
        datasets: [{
          label: "Incidents by Day",
          data: dayCount,
          backgroundColor: "#198754"
        }]
      },
      options: { plugins:{legend:{display:false}}}
    });
  }

  // Drawer toggle
  const drawer = document.getElementById("chartDrawer");
  const toggle = document.getElementById("chartToggle");
  toggle.addEventListener("click", () => {
    drawer.classList.toggle("open");
    toggle.querySelector("i").classList.toggle("fa-chart-bar");
    toggle.querySelector("i").classList.toggle("fa-angle-left");
  });

  // Map style toggle
  document.getElementById("mapStyle").addEventListener("change", function(){
    map.eachLayer(layer => map.removeLayer(layer));
    if(this.value === "street") streetTiles.addTo(map);
    if(this.value === "dark") darkTiles.addTo(map);
    if(this.value === "satellite") satelliteTiles.addTo(map);
    markersLayer.addTo(map);
  });

  document.getElementById('filterBtn').addEventListener('click', applyFilters);
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    document.getElementById('startDate').value='';
    document.getElementById('endDate').value='';
    document.getElementById('crimeType').value='';
    renderMarkers(normData);
    updateCharts(normData);
  });

  await loadData();
})();
</script>
</body>
</html>

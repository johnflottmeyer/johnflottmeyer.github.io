<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Olmsted County Sheriff's Daily Activity Map (Free)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      html, body { height: 100%; margin: 0; padding: 0; }
      #map { height: 100%; width: 100%; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      const DATA_URL = "https://script.google.com/macros/s/AKfycbyu7pbLizSL2QH-ZIp_sFGAlRwvvZupQN_x6OLh2a_ra5nseqP-0ww-D3KbJCzYCi_7_Q/exec";
      let map, markersLayer;

      async function fetchData() {
        const response = await fetch(DATA_URL);
        const data = await response.json();
        return data.records || data;
      }

      async function initMap() {
        if (!map) {
          map = L.map('map').setView([44.0221, -92.4630], 11); // Rochester, MN
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
          }).addTo(map);
          markersLayer = L.layerGroup().addTo(map);
        }

        const data = await fetchData();
        markersLayer.clearLayers();

        data.forEach(item => {
          if (!item.lat || !item.long) return;

          const marker = L.marker([parseFloat(item.lat), parseFloat(item.long)])
            .bindPopup(`
              <strong>${item.incidentType}</strong><br>
              ${item.fullAddress || ""}<br>
              ${item.city || ""} ${item.zip || ""}<br>
              <small>${item.datetime}</small>
            `);

          markersLayer.addLayer(marker);
        });

        console.log(`Loaded ${data.length} incidents`);
      }

      // refresh every 5 minutes
      initMap();
      setInterval(initMap, 5 * 60 * 1000);
    </script>
  </body>
</html>

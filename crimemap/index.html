<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Crime Map with Font Awesome 6 Markers & Legend</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    body { margin:0; font-family:system-ui; }
    #controls { padding:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:#f6f7f8; border-bottom:1px solid #ddd;}
    #map { height: calc(100vh - 72px); width:100%; }
    select,input[type="date"],button { padding:6px 8px; border-radius:6px; border:1px solid #ccc; }
    .info { font-size:13px; color:#555; margin-left:8px;}
    .fa-icon { font-size: 24px; }
    .legend i { margin-right: 6px; }
    #disclaimer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(255,255,255,0.9);
      padding: 8px 12px;
      font-size: 13px;
      text-align: center;
      border-top: 1px solid #ccc;
      color: #333;
      z-index: 1000;
    }

  </style>
</head>
<body>

<div id="controls">
  <label>From: <input type="date" id="startDate"></label>
  <label>To: <input type="date" id="endDate"></label>

  <label>Type:
    <select id="crimeType">
      <option value="">All</option>
    </select>
  </label>

  <button id="filterBtn">Apply</button>
  <button id="resetBtn">Reset</button>

  <span class="info" id="status">Loading…</span>
</div>

<div id="map"></div>

<script>
(async function(){
  const DATA_URL = "https://script.google.com/macros/s/AKfycbyu7pbLizSL2QH-ZIp_sFGAlRwvvZupQN_x6OLh2a_ra5nseqP-0ww-D3KbJCzYCi_7_Q/exec";
  const CENTER = [44.0221, -92.4630];
  const ZOOM = 11;

  let map = L.map('map').setView(CENTER, ZOOM);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  let markersLayer = L.layerGroup().addTo(map);
  let rawData = [];
  let normData = [];

  function pick(o, keys){
    for(const k of keys){
      if (o && o[k] !== undefined && o[k] !== null && String(o[k]).trim() !== "") return o[k];
    }
    return "";
  }

  function normalize(rec){
    const raw = rec || {};
    const dateStr = pick(raw, ['createDateTime','CreateDateTime','DateTimeIncident','date','datetime']);
    let date = dateStr ? new Date(dateStr) : null;
    const lat = parseFloat(pick(raw, ['lat','Lat','latitude','Latitude']));
    const lng = parseFloat(pick(raw, ['long','lng','lon','Longitude']));
    return {
      raw,
      date,
      dateRaw: dateStr || "",
      lat: (!isNaN(lat) ? lat : null),
      lng: (!isNaN(lng) ? lng : null),
      type: pick(raw, ['incidentType','IncidentType','crime','Crime','type','Type','Incident']),
      address: pick(raw, ['FullAddress','address','Address','location','Location']),
      city: pick(raw, ['city','City','venue','Venue']),
      zip: pick(raw, ['zip','Zip','postal','Postal'])
    };
  }

  async function loadData(){
    document.getElementById('status').textContent = 'Loading data…';
    try {
      const res = await fetch(DATA_URL);
      if(!res.ok) throw new Error('Fetch failed: ' + res.status);
      rawData = await res.json();
      if (rawData && rawData.records) rawData = rawData.records;
      if (!Array.isArray(rawData)) { console.error('Bad feed:', rawData); return; }
      normData = rawData.map(normalize);
      populateTypes();
      renderMarkers(normData);
      addLegend(map);
      document.getElementById('status').textContent = `Loaded ${normData.length} records`;
    } catch (err) {
      console.error(err);
      document.getElementById('status').textContent = 'Error loading feed';
    }
  }

  function populateTypes(){
    const types = Array.from(new Set(normData.map(d=>d.type).filter(Boolean))).sort();
    const select = document.getElementById('crimeType');
    select.querySelectorAll('option:not([value=""])').forEach(n=>n.remove());
    types.forEach(t => { const opt = document.createElement('option'); opt.value = t; opt.textContent = t; select.appendChild(opt); });
  }

  function popupHtml(d){
    return `<div style="font-size:13px;">
      <strong>${d.type || 'Incident'}</strong><br/>
      ${d.address || ''}<br/>
      ${d.city || ''} ${d.zip || ''}<br/>
      <small>${d.dateRaw || ''}</small>
    </div>`;
  }

  function iconForType(type){
    const t = (type||'').toLowerCase();
    let iconClass = "fa-map-marker-alt";
    let color = "red";
    if(t.includes("traffic")) { iconClass = "fa-car"; color = "blue"; }
    if(t.includes("burglary")) { iconClass = "fa-user-secret"; color = "orange"; }
    if(t.includes("theft")) { iconClass = "fa-hand-paper"; color = "purple"; }
    if(t.includes("drugs")) { iconClass = "fa-prescription-bottle-medical"; color = "green"; }
    if(t.includes("assist")) { iconClass = "fa-hands-helping"; color = "cadetblue"; }
    if(t.includes("crisis")) { iconClass = "fa-triangle-exclamation"; color = "yellow"; }

    return L.divIcon({
      html: `<i class="fa ${iconClass} fa-icon" style="color:${color}"></i>`,
      className: "",
      iconSize: [24, 24],
      iconAnchor: [12, 24]
    });
  }

  function renderMarkers(data){
    markersLayer.clearLayers();
    let count = 0;
    data.forEach(d=>{
      if(d.lat == null || d.lng == null) return;
      const marker = L.marker([d.lat,d.lng], {icon:iconForType(d.type)})
        .bindPopup(popupHtml(d));
      markersLayer.addLayer(marker);
      count++;
    });
    document.getElementById('status').textContent = `Showing ${count} of ${normData.length} records`;
  }

  function applyFilters(){
    const startVal = document.getElementById('startDate').value;
    const endVal = document.getElementById('endDate').value;
    const typeVal = document.getElementById('crimeType').value;
    const start = startVal ? new Date(startVal+'T00:00:00') : null;
    const end = endVal ? new Date(endVal+'T23:59:59') : null;

    const filtered = normData.filter(d=>{
      if(d.lat == null || d.lng == null) return false;
      if(start && (!d.date || d.date<start)) return false;
      if(end && (!d.date || d.date>end)) return false;
      if(typeVal && (!d.type || d.type.toLowerCase()!==typeVal.toLowerCase())) return false;
      return true;
    });
    renderMarkers(filtered);
  }

  function addLegend(map) {
    const legend = L.control({position: 'bottomright'});
    legend.onAdd = function () {
        const div = L.DomUtil.create('div', 'info legend');
        div.style.background = "white";
        div.style.padding = "8px";
        div.style.borderRadius = "6px";
        div.style.boxShadow = "0 0 15px rgba(0,0,0,0.2)";
        div.innerHTML += "<strong>Crime Types</strong><br/>";

        const types = [
            {label: "Traffic", icon: "fa-car", color: "blue"},
            {label: "Burglary", icon: "fa-user-secret", color: "orange"},
            {label: "Theft", icon: "fa-hand-paper", color: "purple"},
            {label: "Drugs", icon: "fa-prescription-bottle-medical", color: "green"},
            {label: "Assist", icon: "fa-hands-helping", color: "cadetblue"},
            {label: "Crisis", icon: "fa-triangle-exclamation", color: "yellow"},
            {label: "Other", icon: "fa-map-marker-alt", color: "red"}
        ];

        types.forEach(type => {
            div.innerHTML +=
                `<i class="fa ${type.icon}" style="color:${type.color}; font-size:18px;"></i> ${type.label}<br/>`;
        });

        return div;
    };
    legend.addTo(map);
  }

  document.getElementById('filterBtn').addEventListener('click', applyFilters);
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    document.getElementById('startDate').value='';
    document.getElementById('endDate').value='';
    document.getElementById('crimeType').value='';
    renderMarkers(normData);
  });

  await loadData();
})();
</script>
<div id="disclaimer">
  ⚠ <strong>Disclaimer:</strong> These are reported incidents. They do not necessarily represent confirmed crimes or convictions. Data is provided for informational purposes only.
</div>
</body>
</html>

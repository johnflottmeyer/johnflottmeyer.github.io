<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Olmsted County Sheriff's Daily Activity Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      html, body { height: 100%; margin: 0; padding: 0; }
      #map { height: 100%; width: 100%; }
      .leaflet-popup-content { font-size: 14px; line-height: 1.4; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      const DATA_URL =
        "https://script.google.com/macros/s/AKfycbyu7pbLizSL2QH-ZIp_sFGAlRwvvZupQN_x6OLh2a_ra5nseqP-0ww-D3KbJCzYCi_7_Q/exec";
      let map, markersLayer;

      // Custom icons by incident type
      const icons = {
        "Traffic Stop": L.icon({
          iconUrl: "https://maps.google.com/mapfiles/ms/icons/blue-dot.png",
          iconSize: [32, 32],
          iconAnchor: [16, 32],
          popupAnchor: [0, -30]
        }),
        "Burglary": L.icon({
          iconUrl: "https://maps.google.com/mapfiles/ms/icons/red-dot.png",
          iconSize: [32, 32],
          iconAnchor: [16, 32],
          popupAnchor: [0, -30]
        }),
        "Person in Crisis": L.icon({
          iconUrl: "https://maps.google.com/mapfiles/ms/icons/yellow-dot.png",
          iconSize: [32, 32],
          iconAnchor: [16, 32],
          popupAnchor: [0, -30]
        }),
        "Drugs - Paraphernalia": L.icon({
          iconUrl: "https://maps.google.com/mapfiles/ms/icons/purple-dot.png",
          iconSize: [32, 32],
          iconAnchor: [16, 32],
          popupAnchor: [0, -30]
        }),
        "Assist": L.icon({
          iconUrl: "https://maps.google.com/mapfiles/ms/icons/orange-dot.png",
          iconSize: [32, 32],
          iconAnchor: [16, 32],
          popupAnchor: [0, -30]
        }),
        default: L.icon({
          iconUrl: "https://maps.google.com/mapfiles/ms/icons/green-dot.png",
          iconSize: [32, 32],
          iconAnchor: [16, 32],
          popupAnchor: [0, -30]
        })
      };

      async function fetchData() {
        const response = await fetch(DATA_URL);
        const data = await response.json();
        return data.records || data;
      }

      async function initMap() {
        if (!map) {
          map = L.map("map").setView([44.0221, -92.4630], 11); // Rochester, MN
          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "© OpenStreetMap contributors"
          }).addTo(map);
          markersLayer = L.layerGroup().addTo(map);
        }

        const data = await fetchData();
        markersLayer.clearLayers();

        data.forEach((item) => {
          if (!item.lat || !item.long) return;

          const marker = L.marker(
            [parseFloat(item.lat), parseFloat(item.long)],
            {
              icon: icons[item.incidentType] || icons.default
            }
          ).bindPopup(`
            <strong>${item.incidentType}</strong><br>
            ${item.fullAddress || ""}<br>
            ${item.city || ""} ${item.zip || ""}<br>
            <small>${item.datetime}</small>
          `);

          markersLayer.addLayer(marker);
        });

        console.log(`Loaded ${data.length} incidents`);
      }

      // Run immediately and every 5 minutes
      initMap();
      setInterval(initMap, 5 * 60 * 1000);
    </script>
  </body>
</html>
